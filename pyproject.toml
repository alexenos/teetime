[tool.poetry]
name = "teetime"
# Frozen: not the application's version, and never bumped. The app version is
# app.__version__ (operations/versioning.md). The Dockerfile copies this file
# before `poetry install`, so editing it on every deploy would bust the cached
# dependency layer (#424). tests/test_version.py pins it.
version = "1.0.0"
description = "Golf tee time reservation application with SMS interface and LLM-powered natural language understanding"
authors = ["Devin AI <devin@cognition.ai>"]
readme = "README.md"
# The project is named teetime but the code lives in app/, so Poetry has no
# package to install for the root project. Poetry 1.8+ - the Dockerfile and CI
# pin 2.4.3 (#153) - makes that a hard error in the CI "Install project" step
# (`poetry install`); 1.7.1 only warned. Naming the real package fixes it (#152):
# verified exit 0 on 1.7.1 and 2.3.3 (#152), and on 2.4.3 in CI (#153).
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11.5,<4.0"
fastapi = "^0.163.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pydantic = "^2.14.3"
pydantic-settings = "^2.6.0"
twilio = "^9.13.0"
sqlalchemy = "^2.1.9"
asyncpg = "^0.32.0"
alembic = "^1.20.1"
python-dotenv = "^1.0.0"
httpx = "^0.28.0"
apscheduler = "^3.11.3"
pytz = "^2024.2"
python-multipart = "^0.0.34"
aiosqlite = "^0.22.1"
selenium = "^4.52.0"
webdriver-manager = "^4.1.2"
google-auth = "^2.62.2"
psycopg2-binary = "^2.9.13"
discord-py = "^2.4"
cryptography = "^50.0.0"
google-genai = "^1.56"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.17.5"
mypy = "^1.13.0"
types-pytz = "^2025.2.0.20251108"
beautifulsoup4 = "^4.15.0"
vulture = "^2.16"
pytest-cov = "^6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE001", "S324"]
ignore = ["E501"]
# `# noqa: V10x` codes belong to vulture (see [tool.vulture]), not ruff.
external = ["V"]

# BLE001 is a ratchet (#291): enforced everywhere except the files below, which
# had unjustified broad excepts when it was turned on. Each line is a tech-debt
# issue; delete the line in the PR that clears the file. Never add a line here
# to get a new broad except past lint - justify it with `# noqa: BLE001 - why`.
[tool.ruff.lint.per-file-ignores]
"app/providers/walden_provider.py" = ["BLE001"]  # #368
"app/providers/walden_date_selection.py" = ["BLE001"]  # #369
"app/services/booking_service.py" = ["BLE001"]  # #370
"app/providers/twilio_provider.py" = ["BLE001"]  # #371

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Dead-code scan used by the tech-debt Routine: `poetry run vulture app`.
# Not part of CI. Hits at 60% confidence still need a grep for callers before
# they are treated as findings (see operations/routines/tech-debt.md).
[tool.vulture]
paths = ["app"]
min_confidence = 60
ignore_decorators = ["@router.*", "@field_validator", "@model_validator", "@app.*", "@*.event"]
# HTMLParser calls handle_* on its subclasses, so no caller exists in app/.
# Other framework-called names are marked on their own line with `# noqa: V10x`
# instead, because ignore_names matches a name in every file.
ignore_names = ["handle_starttag", "handle_startendtag", "handle_endtag", "handle_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that drive a real headless Chrome (deselect with -m 'not integration')",
]

# Coverage is reported, not gated (#11). CI runs `pytest --cov` and publishes the
# table to the job summary; the tech-debt and feature-dev Routines read it.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
