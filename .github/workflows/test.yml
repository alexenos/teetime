name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run linting with Ruff
        run: poetry run ruff check .

      - name: Run type checking with mypy
        run: poetry run mypy app

      # tests/test_async_chain_integration.py drives a real headless Chrome.
      # Installing it here declares the version instead of inheriting whatever
      # the runner image happens to ship, and the suite now fails rather than
      # skips when it is missing (CI is set by Actions) - see #159.
      #
      # install-chromedriver gives a driver matched to the Chrome installed
      # here. Both paths are then handed to pytest explicitly: left to their
      # own lookups, chromedriver resolves the browser to
      # /usr/bin/google-chrome and Selenium prefers a chromedriver already on
      # PATH - both of which are the runner image's, not this step's, and a
      # major version apart from it.
      - name: Install Chrome for the browser integration tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run tests with pytest
        run: poetry run pytest -v --tb=short --cov --cov-report=term --cov-report=json:coverage.json
        env:
          # Both come from the step above, so the pair always matches. Empty
          # or unset falls back to the default lookups, which is what ran here
          # before this step existed.
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      # Report only, no threshold (#11). The per-file table is printed in the pytest
      # log (--cov-report=term) and written to the job summary; coverage.json is the
      # artifact the tech-debt and feature-dev Routines read.
      - name: Publish coverage
        if: ${{ !cancelled() }}
        run: poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore

      # Ratchet (#11): the count of uncovered statements and branches may not rise,
      # and must be lowered in the PR that lowers it. Fails on any difference from
      # operations/coverage-ratchet.txt and prints the value to commit. The
      # percentage is still reported (table above, and in this step's output).
      # After the upload so the artifact is kept when this step fails.
      - name: Check coverage ratchet
        run: python scripts/check_coverage_ratchet.py coverage.json operations/coverage-ratchet.txt

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Check code formatting with Ruff
        run: poetry run ruff format --check .
