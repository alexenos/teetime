name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Poetry both jobs install. It must equal the Dockerfile's pin
# (tests/test_poetry_pin.py), and it is part of the venv cache key, so moving it
# rebuilds the venv under the new Poetry instead of restoring the old one (#153).
env:
  POETRY_VERSION: "2.4.3"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-poetry-${{ env.POETRY_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run linting with Ruff
        run: poetry run ruff check .

      - name: Run type checking with mypy
        run: poetry run mypy app

      # tests/test_async_chain_integration.py drives a real headless Chrome.
      # Installing it here declares the version instead of inheriting whatever
      # the runner image happens to ship, and the suite now fails rather than
      # skips when it is missing (CI is set by Actions) - see #159.
      #
      # install-chromedriver gives a driver matched to the Chrome installed
      # here. Both paths are then handed to pytest explicitly: left to their
      # own lookups, chromedriver resolves the browser to
      # /usr/bin/google-chrome and Selenium prefers a chromedriver already on
      # PATH - both of which are the runner image's, not this step's, and a
      # major version apart from it.
      - name: Install Chrome for the browser integration tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run tests with pytest
        run: poetry run pytest -v --tb=short --cov --cov-report=term --cov-report=json:coverage.json
        env:
          # Both come from the step above, so the pair always matches. Empty
          # or unset falls back to the default lookups, which is what ran here
          # before this step existed.
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      # Report only, no threshold (#11). The per-file table is printed in the pytest
      # log (--cov-report=term) and written to the job summary; coverage.json is the
      # artifact the tech-debt and feature-dev Routines read.
      - name: Publish coverage
        if: ${{ !cancelled() }}
        run: poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore

      # Ratchet (#11): the count of uncovered statements and branches may not rise,
      # and must be lowered in the PR that lowers it. Fails when the count is more than
      # 5 from operations/coverage-ratchet.txt (run-to-run noise, #379) and prints the
      # value to commit. The
      # percentage is still reported (table above, and in this step's output).
      # After the upload so the artifact is kept when this step fails.
      - name: Check coverage ratchet
        run: python scripts/check_coverage_ratchet.py coverage.json operations/coverage-ratchet.txt

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-poetry-${{ env.POETRY_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Check code formatting with Ruff
        run: poetry run ruff format --check .

  # Known vulnerabilities in poetry.lock fail the build (#487, recommendation 4 in
  # operations/dependency-updates.md). Reviewed exceptions, each with a reason and an
  # expiry, are in osv-scanner.toml. The binary is pinned and checksummed rather
  # than fetched as latest; Dependabot does not update it, so a bump is a
  # deliberate edit of both values below. Exit 128 (no packages found) fails too.
  audit:
    runs-on: ubuntu-latest

    env:
      OSV_SCANNER_VERSION: v2.7.1
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan poetry.lock for known vulnerabilities
        run: ./osv-scanner scan source --lockfile=poetry.lock --config=osv-scanner.toml

  # cloudbuild.yaml runs `terraform apply -auto-approve` on every merge to main,
  # so before this job a malformed terraform change was first caught by the
  # pipeline that applies it (#229, item 1). fmt and validate need no
  # credentials and no state: init skips the GCS backend and only fetches
  # providers. The version matches the hashicorp/terraform image cloudbuild.yaml
  # applies with; tests/test_terraform_ci.py fails if the two drift apart.
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6.0"
          terraform_wrapper: false

      - name: Check terraform formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize terraform without a backend
        run: terraform init -backend=false -input=false

      - name: Validate terraform
        run: terraform validate -no-color
